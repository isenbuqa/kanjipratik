
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanji Pratik - Sakura Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sakura-pink: #ffb7c5;
            --sakura-light: #fff5f7;
            --sky-blue: #e0f2fe;
        }
        body {
            font-family: 'Quicksand', 'Noto+Sans+JP', sans-serif;
            background: linear-gradient(135deg, #fff5f7 0%, #f0f9ff 100%);
            background-attachment: fixed;
            color: #475569;
        }
        .kanji-font {
            font-family: 'Noto+Sans+JP', sans-serif;
        }
        .perspective-1000 {
            perspective: 1000px;
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        .transition-transform-600 {
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .preserve-3d {
            transform-style: preserve-3d;
        }
        .sakura-shadow {
            box-shadow: 0 10px 25px -5px rgba(255, 183, 197, 0.3), 0 8px 10px -6px rgba(255, 183, 197, 0.2);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #ffb7c5;
            border-radius: 10px;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
<body class="overflow-x-hidden">
    <div id="root"></div>
</body>
</html>
